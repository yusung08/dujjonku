<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 두쫀쿠</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#fff3e0;--bg2:#f3d9b8;--fg:#3b2314;--btn:rgba(255,255,255,.75);--btn-fg:#3b2314}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a2a20;--bg2:#1c130d;--fg:#f5e6d3;--btn:rgba(255,255,255,.12);--btn-fg:#f5e6d3}}
:root[data-theme="dark"]{--bg1:#3a2a20;--bg2:#1c130d;--fg:#f5e6d3;--btn:rgba(255,255,255,.12);--btn-fg:#f5e6d3}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% 40%,var(--bg1),var(--bg2));color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;pointer-events:none}
.top h1{margin:0;font-size:22px;letter-spacing:-.02em}
.top p{margin:4px 0 0;font-size:13px;opacity:.7}
.bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 12px}
button{font:inherit;font-size:14px;padding:10px 16px;border:0;border-radius:999px;background:var(--btn);color:var(--btn-fg);backdrop-filter:blur(8px);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
button.on{background:#6b8e23;color:#fff}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-190px);font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#mc{background:var(--bg1);color:var(--fg);border-radius:18px;padding:16px;width:min(420px,100%);max-height:80vh;overflow:auto;touch-action:pan-y;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#mc input[type=range]{touch-action:none}
#mc h2{margin:0 0 8px;font-size:18px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(128,128,128,.25)}
.row div{flex:1;font-size:13px;line-height:1.4}
button:disabled{opacity:.4;cursor:default}
#petbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;pointer-events:none;font-size:24px}
#petbar span{animation:hop .5s infinite alternate ease-in-out}
@keyframes hop{to{transform:translateY(-9px)}}
#dg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 112px);left:0;right:0;text-align:center;pointer-events:none;display:none}
#dg .dgm{font-size:56px;line-height:1.1;transition:transform .08s}
#dg .dgm.hit{transform:scale(.85) rotate(-6deg)}
#dg .dgb{width:min(220px,60%);height:10px;margin:2px auto;background:rgba(0,0,0,.3);border-radius:6px;overflow:hidden}
#dg .dgb i{display:block;height:100%;background:#e03131;transition:width .1s}
#dg .dgt{font-size:13px;font-weight:700}
#dg .pop{position:absolute;left:50%;top:50px;font-weight:800;color:#f08c00;animation:pop .7s forwards;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.4)}
@keyframes pop{to{transform:translate(var(--x,0),-50px);opacity:0}}
#dgs{position:fixed;inset:0;z-index:3;display:none;background:linear-gradient(#1b1030,#3a1c4d 60%,#2b1a2a);touch-action:none}
#dgx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px}
#dgc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;text-align:center;color:#ffd43b;font-weight:800;font-size:18px;pointer-events:none}
#dgtap{position:absolute;bottom:200px;left:0;right:0;text-align:center;color:#fff;opacity:.6;font-size:15px;pointer-events:none}
#dg{z-index:4}#dg .dgt{color:#fff}#dg .dgm{font-size:96px}
.bar,#petbar{z-index:4}#toast{z-index:6}
.proj{position:fixed;font-size:28px;pointer-events:none;z-index:4;transition:all .22s ease-in}
#combo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);left:0;right:0;text-align:center;font-size:20px;font-weight:800;color:#e8590c;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="top"><h1>두쫀쿠 🍪</h1><p>드래그로 돌리고 · 톡 터치하면 한 입 🦷 · 쭉 누르면 또잉또잉 🎈</p><p id="stat" style="font-weight:600;opacity:.9"></p></div>
<div id="toast"></div><div id="combo"></div><div id="dgs"><button id="dgx">← 두쫀쿠로</button><div id="dgc"></div><div id="dgtap">👆 화면을 탭해서 공격!</div></div><div id="dg"><div class="dgt" id="dgf"></div><div class="dgm" id="dgm"></div><div class="dgb"><i id="dgbar"></i></div><div class="dgt" id="dgh"></div></div><div id="petbar"></div><div id="modal"><div id="mc"></div></div>
<div class="bar">
  <button id="cut">🔪 단면 보기</button>
  <button id="auto" class="on">🔄 자동 회전</button>
  <button id="reset">↺ 초기화</button>
  <button id="ae" style="display:none">🤖 자동 먹기 ON</button>
  <button id="shop">🎮 메뉴</button>
  <button id="snd" class="on">🔊 소리</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.localClippingEnabled=true;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,.1,50);
let dist=4.2;camera.position.set(0,0,dist);

scene.add(new THREE.HemisphereLight(0xfff0dd,0x553322,.9));
const key=new THREE.DirectionalLight(0xffffff,1.1);key.position.set(3,4,5);scene.add(key);
const rim=new THREE.DirectionalLight(0xffc98a,.6);rim.position.set(-4,1,-3);scene.add(rim);

// 코코아 가루 질감
function noiseTex(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#808080';g.fillRect(0,0,256,256);
  for(let i=0;i<9000;i++){const v=Math.random()*255|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(Math.random()*256,Math.random()*256,2,2)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);return t;
}
// 단면 텍스처
function capTex(){
  const S=512,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d'),R=S/2;
  const circ=(r,col)=>{g.fillStyle=col;g.beginPath();g.arc(R,R,r,0,7);g.fill()};
  circ(R,'#3b2314');circ(R*.93,'#f6ead7');circ(R*.74,'#7fa04a');
  g.save();g.beginPath();g.arc(R,R,R*.74,0,7);g.clip();
  for(let i=0;i<420;i++){ // 카다이프 가닥
    const a=Math.random()*6.28,r=Math.random()*R*.72,x=R+Math.cos(a)*r,y=R+Math.sin(a)*r,l=10+Math.random()*26,b=Math.random()*6.28;
    g.strokeStyle=['#e6c36a','#c9a23f','#b5cf6a','#f0d98a'][i%4];g.lineWidth=2+Math.random()*2;
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(b)*l,y+Math.sin(b)*l,x+Math.cos(b+1)*l,y+Math.sin(b+1)*l);g.stroke();}
  for(let i=0;i<160;i++){const a=Math.random()*6.28,r=Math.random()*R*.7;g.fillStyle=i%2?'#5f8a2e':'#a3c45a';
    g.beginPath();g.arc(R+Math.cos(a)*r,R+Math.sin(a)*r,3+Math.random()*5,0,7);g.fill();}
  g.restore();return new THREE.CanvasTexture(c);
}

// 울퉁불퉁한 쫀득 구
const geo=new THREE.IcosahedronGeometry(1,5);
const p=geo.attributes.position,v=new THREE.Vector3();
for(let i=0;i<p.count;i++){
  v.fromBufferAttribute(p,i).normalize();
  const n=Math.sin(v.x*4.1+1.3)*Math.cos(v.y*3.7)*.5+Math.sin(v.z*5.3+v.x*2.1)*.35+Math.sin(v.y*9+v.z*7)*.12;
  v.multiplyScalar(.97+n*.05);p.setXYZ(i,v.x,v.y,v.z);
}
geo.scale(1,.88,1);geo.computeVertexNormals();
const cream=new THREE.Color(0xf6ead7),green=new THREE.Color(0x8fb04f),origPos=geo.attributes.position.array.slice();
{const n=geo.attributes.position.count,a=new Float32Array(n*3),c0=new THREE.Color(0x4a2c18);for(let i=0;i<n;i++){const k=.85+Math.random()*.3;a[i*3]=c0.r*k;a[i*3+1]=c0.g*k;a[i*3+2]=c0.b*k;}geo.setAttribute('color',new THREE.BufferAttribute(a,3));}
const origCol=geo.attributes.color.array.slice();

const plane=new THREE.Plane(new THREE.Vector3(0,0,-1),0);
const bump=noiseTex();
const shellMat=new THREE.MeshStandardMaterial({color:0xffffff,vertexColors:true,roughness:1,bumpMap:bump,bumpScale:2.2,side:THREE.DoubleSide,clippingPlanes:[]});
const innerMat=new THREE.MeshStandardMaterial({color:0xf6ead7,roughness:.9,side:THREE.BackSide,clippingPlanes:[]});

const root=new THREE.Group(),pivot=new THREE.Group();
root.add(pivot);scene.add(root);
pivot.add(new THREE.Mesh(geo,shellMat));
pivot.add(new THREE.Mesh(geo,innerMat));
const cap=new THREE.Mesh(new THREE.CircleGeometry(.99,64),new THREE.MeshStandardMaterial({map:capTex(),roughness:.8}));
cap.scale.y=.88;cap.position.z=.002;cap.visible=false;pivot.add(cap);

// 바닥 그림자
const sc=document.createElement('canvas');sc.width=sc.height=128;const sg=sc.getContext('2d');
const gr=sg.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(0,0,0,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');sg.fillStyle=gr;sg.fillRect(0,0,128,128);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(3,3),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=-1.15;scene.add(shadow);

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// 상호작용
const home=new THREE.Quaternion().setFromEuler(new THREE.Euler(.35,-.5,0));
pivot.quaternion.copy(home);
let auto=true,cutOn=false,goal=null,vel=new THREE.Vector2(),sq=0,sqv=0;
const ptrs=new Map();let longDone=false,lp,lr,damp=6,bites=0,moved=0,pinch0=0,dist0=0;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;goal=null;vel.set(0,0);longDone=false;clearTimeout(lp);clearTimeout(lr);ac();
  if(ptrs.size==1){const id=e.pointerId;lp=setTimeout(()=>{const q=ptrs.get(id);if(q&&ptrs.size==1&&moved<6){longDone=true;boing();}},400);}
  if(ptrs.size==2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dist0=dist;}});
el.addEventListener('pointermove',e=>{
  const q=ptrs.get(e.pointerId);if(!q)return;
  const dx=e.clientX-q.x,dy=e.clientY-q.y;q.x=e.clientX;q.y=e.clientY;
  if(ptrs.size==2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);dist=clamp(dist0*pinch0/d,2.4,8);moved+=99;return;}
  moved+=Math.abs(dx)+Math.abs(dy);vel.set(dx*.01,dy*.01);rot(vel.x,vel.y);
});
function up(e){
  const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  clearTimeout(lp);clearTimeout(lr);if(had&&e.type=='pointerup'&&moved<6&&ptrs.size==0&&!longDone)tap(e);
}
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist+e.deltaY*.004,2.4,8)},{passive:false});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function rot(dx,dy){const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(dy,dx,0));pivot.quaternion.premultiply(q);}

const ray=new THREE.Raycaster(),m=new THREE.Vector2();
const msgs=['쫀득~ 🍡','말랑말랑!','바삭한 카다이프가 쏙 💚','두바이 감성 ✨','한 입만...'];let mi=0;
function tap(e){
  m.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(m,camera);
  if(!tapExtra(e.clientX,e.clientY))biteAt(e.clientX,e.clientY);
}
const tEl=document.getElementById('toast');let tt;
function toast(s){tEl.textContent=s;tEl.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>tEl.style.opacity=0,900);}

const bMsgs=['냠! 😋','쫀득쫀득~','속이 초록초록 💚','한 입 더?','벌써 이만큼...','거의 다 먹었다 😅'];
function biteAtOld(x,y){
  if(cutOn){toast('단면 모드에선 못 먹어요 🙅');return;}
  m.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(m,camera);
  const h=ray.intersectObject(pivot.children[0]);if(!h.length)return;
  const pt=pivot.worldToLocal(h[0].point.clone()),n=pt.clone().normalize();
  const t1=new THREE.Vector3(0,1,0).cross(n);if(t1.lengthSq()<.01)t1.set(1,0,0);t1.normalize();
  const t2=n.clone().cross(t1),R=.55,base=pt.clone().addScaledVector(n,.12);
  const cs=[base,base.clone().addScaledVector(t1,.34),base.clone().addScaledVector(t1,-.3).addScaledVector(t2,.15),base.clone().addScaledVector(t2,-.32)];
  const P=geo.attributes.position,C=geo.attributes.color,v=new THREE.Vector3(),col=new THREE.Color();
  for(let i=0;i<P.count;i++){
    v.fromBufferAttribute(P,i);let hit=false;
    for(const c of cs){const d=v.distanceTo(c);if(d<R&&d>1e-5){
      v.copy(c).addScaledVector(v.clone().sub(c).normalize(),R);
      col.copy(green).lerp(cream,THREE.MathUtils.smoothstep(d/R,.4,.9));C.setXYZ(i,col.r,col.g,col.b);hit=true;}}
    if(hit)P.setXYZ(i,v.x,v.y,v.z);
  }
  P.needsUpdate=C.needsUpdate=true;geo.computeVertexNormals();geo.computeBoundingSphere();
  sqv=3;crunch();toast(bMsgs[Math.min(bites++,bMsgs.length-1)]);
}
let AC,mute=false;
function ac(){if(mute)return null;if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();if(AC&&!SBL)loadSnd(AC);return AC;}
function crunchOld(){const a=ac();if(!a)return;const t=a.currentTime;
  for(let k=0;k<5;k++){const len=.05,b=a.createBuffer(1,Math.floor(a.sampleRate*len),a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1000+Math.random()*3000;f.Q.value=1.2;
    const g=a.createGain();g.gain.value=.7;s.connect(f);f.connect(g);g.connect(OUT(a));s.start(t+k*.04);}
  const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(60,t+.15);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(OUT(a));o.start(t);o.stop(t+.22);}
function boingSnd(){const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(560,t+.08);o.frequency.exponentialRampToValueAtTime(140,t+.5);
  l.frequency.value=24;lg.gain.value=45;l.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.45,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.55);
  o.connect(g);g.connect(OUT(a));o.start(t);l.start(t);o.stop(t+.6);l.stop(t+.6);}
const boMsgs=['또잉~ 🎈','또잉또잉!','뾰잉뾰잉~'];let bo=0;
function boing(){sqv=9;boingSnd();toast(boMsgs[bo++%boMsgs.length]);clearTimeout(lr);lr=setTimeout(()=>{if(ptrs.size==1&&longDone&&moved<6)boing();},700);}
// ===== 진짜 베어물기: 구(입 모양)로 파내고 파인 단면에 카다이프 질감 =====
const MAXS=160,uB=[];for(let i=0;i<MAXS;i++)uB.push(new THREE.Vector4(0,0,0,0));
const uN={value:0},spheres=[],craters=new THREE.Group(),sphGeo=new THREE.SphereGeometry(1,32,20);pivot.add(craters);
function carve(mat){mat.onBeforeCompile=s=>{
  s.uniforms.uB={value:uB};s.uniforms.uN=uN;
  s.vertexShader='varying vec3 vLP;\n'+s.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvLP=position;');
  s.fragmentShader=`varying vec3 vLP;uniform vec4 uB[${MAXS}];uniform int uN;\n`+s.fragmentShader.replace('#include <clipping_planes_fragment>',`#include <clipping_planes_fragment>
  for(int j=0;j<${MAXS};j++){if(j>=uN)break;if(distance(vLP,uB[j].xyz)<uB[j].w)discard;}`);};}
carve(shellMat);carve(innerMat);
const craterVS=`uniform vec3 uC;uniform float uR;varying vec3 vLP;varying vec3 vN;
void main(){vLP=uC+position*uR;vN=normalize(normalMatrix*(-position));gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const craterFS=`uniform vec4 uB[${MAXS}];uniform int uN;uniform int uS;varying vec3 vLP;varying vec3 vN;
float hh(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(hh(i),hh(i+vec3(1,0,0)),f.x),mix(hh(i+vec3(0,1,0)),hh(i+vec3(1,1,0)),f.x),f.y),
  mix(mix(hh(i+vec3(0,0,1)),hh(i+vec3(1,0,1)),f.x),mix(hh(i+vec3(0,1,1)),hh(i+vec3(1,1,1)),f.x),f.y),f.z);}
void main(){
 vec3 p=vLP;float r=length(p/vec3(1.,.88,1.));
 if(r>.985)discard;
 for(int j=0;j<${MAXS};j++){if(j>=uN)break;if(j!=uS&&distance(p,uB[j].xyz)<uB[j].w-.002)discard;}
 vec3 col;
 if(r>.9){col=vec3(.96,.92,.84)*(.92+.08*vn(p*30.));}
 else{
  float a=vn(vec3(p.xy*20.,p.z*5.)),b=vn(vec3(p.yz*20.,p.x*5.)),c=vn(vec3(p.zx*20.,p.y*5.));
  float st=smoothstep(.07,.0,abs(a-.5))+smoothstep(.07,.0,abs(b-.5))+smoothstep(.07,.0,abs(c-.5));
  vec3 g=mix(vec3(.38,.55,.2),vec3(.66,.8,.35),vn(p*9.));
  col=mix(g,vec3(.92,.74,.3),clamp(st,0.,1.)*.9);
  col=mix(col,vec3(.22,.38,.1),smoothstep(.7,.74,vn(p*16.))*.7);
 }
 vec3 n=normalize(vN);float d=max(dot(n,normalize(vec3(3.,4.,5.))),0.);
 gl_FragColor=vec4(col*(.5+.7*d),1.);
}`;
function addS(c,R){const i=spheres.length;spheres.push(1);uB[i].set(c.x,c.y,c.z,R);
  const mt=new THREE.ShaderMaterial({uniforms:{uB:{value:uB},uN:uN,uS:{value:i},uC:{value:c.clone()},uR:{value:R}},vertexShader:craterVS,fragmentShader:craterFS,side:THREE.BackSide});
  const me=new THREE.Mesh(sphGeo,mt);me.position.copy(c);me.scale.setScalar(R);craters.add(me);}
const tmp=new THREE.Vector3();
function solid(pt,isCrater){
  for(let j=0;j<spheres.length;j++)if(pt.distanceTo(tmp.set(uB[j].x,uB[j].y,uB[j].z))<uB[j].w-.01)return false;

$('auto').onclick=()=>{auto=!auto;$('auto').classList.toggle('on',auto);};
$('reset').onclick=()=>{goal=home.clone();dist=4.2;restore();upd(1);};
$('snd').onclick=()=>{mute=!mute;$('snd').classList.toggle('on',!mute);$('snd').textContent=mute?'🔇 소리 꺼짐':'🔊 소리';if(!mute)ac();};

let last=performance.now();
(function loop(t){
  requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;
  if(!ptrs.size){
    if(goal){pivot.quaternion.slerp(goal,.1);if(pivot.quaternion.angleTo(goal)<.005)goal=null;}
    else if(vel.lengthSq()>1e-6){rot(vel.x,vel.y);vel.multiplyScalar(.93);}
    else if(auto&&!cutOn)rot(.35*dt,0);
  }
  // 쫀득 스프링
  damp=longDone&&ptrs.size?1.4:5;sqv+=(-90*sq-damp*sqv)*dt;sq+=sqv*dt;
  const bs=boss?1.3:1;root.scale.set(bs*(1+.18*sq),bs*(1-.3*sq),bs*(1+.18*sq));root.position.y=Math.max(0,-sq)*.3;
  shadow.scale.setScalar(1+.15*sq);
  tick(dt);camera.position.z+=(dist-camera.position.z)*.12;
  plane.normal.set(0,0,-1).applyQuaternion(pivot.quaternion);plane.constant=0;
  renderer.render(scene,camera);
})(performance.now());
})();
</script>
</body>
</html>
